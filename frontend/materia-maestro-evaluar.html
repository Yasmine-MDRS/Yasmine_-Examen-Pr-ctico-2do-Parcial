<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Calificación Materia-Maestro</title>
  <link rel="stylesheet" href="estiloEvaluarMaterias.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light barra-superior">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="cetilogo.png" alt="Logo CETI" class="logo">
    </a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="Start.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="maestros.html">Maestro</a></li>

      </ul>

<section class="card">
  <!-- Agregar información específica -->
  <div class="item" id="mmNombre">Cargando materia y maestro...</div>
  <div class="item">Califica la materia-maestro:</div>

  <!-- Campos ocultos para guardar los IDs -->
  <input type="hidden" id="idMateria" value="">
  <input type="hidden" id="idMaestro" value="">

  <div class="stars" id="starsContainer">
    <button class="star-btn" data-value="1">★</button>
    <button class="star-btn" data-value="2">★</button>
    <button class="star-btn" data-value="3">★</button>
    <button class="star-btn" data-value="4">★</button>
    <button class="star-btn" data-value="5">★</button>
  </div>

  <div class="submit-container">
    <button class="submit" id="btnEnviar">Enviar</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
