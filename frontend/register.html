<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Sistema de Evaluación CETI</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuente Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <!-- CSS personalizado -->
  <link rel="stylesheet" href="estilopro.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <img src="cetilogo.png" alt="Logo CETI" class="position-absolute top-0 start-0 m-3" style="width:120px;">

  <div class="card p-4 shadow">
    <label class=" fs-3 titulo-label text-center d-block mb-3">
      Bienvenido al Sistema de Evaluación de Docentes y Materias
    </label>

    <form id="registroForm">
      <div class="mb-3">
        <label for="correo" class="text-center d-block mb-3|">Correo Institucional</label>
        <input type="email" class="form-control" id="correo" placeholder="ejemplo@ceti.mx" required>

        <label for="password" class="text-center d-block mb-3">Ingresa una contraseña valida</label>
        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>

        <label for="confirmar" class="text-center d-block mb-3">Repita la misma contraseña</label>
        <input type="password" class="form-control" id="confirmar" placeholder="Confirmar contraseña" required>
      </div>
      </form>
            <button type="submit" class="btn btn-success">Registrarse</button>
<label style="border-radius: 0; display: block; text-align: center; padding: 8px 12px;font-size:9px; color: #5f73b3;background-color:  rgba(255, 255, 255, 0.7);">   
      ¿Ya tienes una cuenta?
      <a href="newsession.html" class="text-decoration-underline">Inicia Sesión</a>
    
  </label>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS personalizado -->
  <script src="scriptreg.js"></script>
</body>
</html>
